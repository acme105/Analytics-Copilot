        AND purchased_at >= DATE '2017-01-01' AND purchased_at < DATE '2018-01-01'
      GROUP BY 1

  - id: h006
    question: Among categories with at least 1,000 reviewed orders, which 3 have the highest share of 1 and 2 star reviews?
    difficulty: hard
    category: reviews
    ordered: true
    ambiguous: true
    notes: >-
      The top result is 'unknown' (products with no category). Gold keeps it because it is a
      category value in the data; a reader might expect it excluded. Decide at review.
    gold_sql: |
      SELECT product_category, AVG(CASE WHEN review_score <= 2 THEN 1 ELSE 0 END) AS low_review_share
      FROM fct_orders
      WHERE review_score IS NOT NULL
        AND purchased_at >= DATE '2017-01-01' AND purchased_at < DATE '2018-09-01'
      GROUP BY 1 HAVING COUNT(*) >= 1000
      ORDER BY low_review_share DESC LIMIT 3

