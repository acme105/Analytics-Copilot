# Golden eval set: questions with hand-written gold SQL against the marts.
#
# Rules (DECISIONS D20, D22):
# - Gold SQL is written directly against the warehouse, never with the pipeline under test.
# - Gold follows the signed-off definitions: valid orders only for sales metrics, delivered
#   orders for delivery metrics, purchase date for all dates, default window 2017-01-01 to
#   2018-09-01, customer_unique_id for people.
# - Only `verified: true` items count in headline metrics. Everything starts unverified and is
#   reviewed in batches of 20.
# - No near-duplicates of semantic/examples.yaml or the smoke questions (checked by tests).
# - `ordered: true` means row order is part of the answer (rankings). Label-only columns
#   (e.g. "late" vs "on time") are left out of gold where their wording can't be predicted;
#   the numeric columns carry the answer.

items:
  # ---------------------------------------------------------------- easy (40)
  - id: e001
    question: How many orders were placed in 2017?
    difficulty: easy
    category: orders
    notes: "\"Placed\" counts every order whatever its status (D24)."
    gold_sql: |
      SELECT COUNT(*) AS orders FROM fct_orders
      WHERE purchased_at >= DATE '2017-01-01' AND purchased_at < DATE '2018-01-01'

  - id: e002
    question: How much GMV did Olist generate in the first half of 2018?
    difficulty: easy
    category: gmv
    gold_sql: |
      SELECT SUM(price) AS gmv FROM fct_order_items
      WHERE is_valid AND purchased_at >= DATE '2018-01-01' AND purchased_at < DATE '2018-07-01'

  - id: e003
    question: What was the average order value in 2018?
    difficulty: easy
    category: gmv
    gold_sql: |
      SELECT SUM(gmv) / COUNT(*) AS aov FROM fct_orders
      WHERE is_valid AND items > 0
        AND purchased_at >= DATE '2018-01-01' AND purchased_at < DATE '2018-09-01'

  - id: e004
    question: What is the overall average review score?
    difficulty: easy
    category: reviews
    gold_sql: |
