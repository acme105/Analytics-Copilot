# Governed semantic layer for the Olist warehouse.
#
# Every metric is one aggregate SQL expression over one mart table, plus the filters that
# always apply to it. `analytics_copilot.semantic` compiles a metric, a time grain and
# dimensions into a single SELECT. Definitions are drafts until signed off (see DECISIONS.md).

version: 1

# Default analysis window (DECISIONS D5). The end is exclusive.
default_window:
  start: "2017-01-01"
  end: "2018-09-01"

time_grains: [day, week, month, quarter, year]

# The signed-off decisions (DECISIONS.md) that apply across metrics, in words the SQL model
# follows. They are sent to the model in semantic and semantic_rag mode, never raw_schema.
# Sources, in order: valid-order definition + D12, D24, delivery metric definitions, review
# metric definitions, D6, D5, D4, GMV definition, grain of the marts (D34).
business_rules:
  - >-
    Canceled and unavailable orders are not real sales. For orders, GMV, AOV, items per
    order, customers, sellers, freight and payments, always filter `is_valid`. Only the
    cancellation rate looks at all orders.
  - >-
    Exception: when a question counts orders that were "placed", count every order whatever
    its status (the orders_placed metric; do not filter `is_valid`). "Orders placed in 2018"
    used only to name the period of another metric, such as a delivery rate, keeps that
    metric's own filters.
  - >-
    Delivery metrics (late rate, on-time rate, delivery days) use delivered orders only:
    always filter `is_delivered`.
  - >-
    Review metrics use reviewed orders only: always filter `review_score IS NOT NULL`.
  - >-
    Every date filter and every time grouping uses `purchased_at`, including delivery and
    review metrics. "Late deliveries in March" means orders placed in March that arrived late.
  - >-
    Always limit `purchased_at` to the default window, even when the question gives no
    dates. When the question names a period, keep only the part inside the window: data ends
    in August 2018, so "in 2018" means purchased_at >= '2018-01-01' AND purchased_at < '2018-09-01'.
  - >-
    A customer is a person: count `customer_unique_id`.
  - >-
    Money is in Brazilian reais (R$). GMV and prices exclude freight unless the question asks
    about freight.
  - >-
    Pick the table by what one row should be. Per order (order counts, AOV, items per order,
    delivery, reviews, freight per order): fct_orders. Per item (GMV and freight totals by
    category or seller, sellers): fct_order_items. Payment amounts, types and instalments:
    fct_payments. Never average item rows to get a per-order figure.

# Business vocabulary (D44): what common terms mean in this data, in words and SQL. Shown to
# the planner and to custom SQL, so definitions aren't left for the model to guess.
glossary:
  - term: first order
    definition: A person's first valid order. customer_order_number = 1 (customer_type = 'first_order').
  - term: repeat order
    definition: >-
      Any later valid order of the same person, all pooled together.
      customer_order_number >= 2 (customer_type = 'repeat_order'). "First vs repeat" is two groups.
  - term: new customer
    definition: A person whose first valid order falls in the period.
  - term: returning customer
    definition: >-
      A first-time customer who placed another valid order before the end of the analysis
      window (next_order_at < DATE '2018-09-01' on their first order).
  - term: late / on time
    definition: >-
      Delivered after / on or before the estimated date, compared as calendar dates. Only
      delivered orders have a delivery status.
  - term: placed orders
    definition: All orders whatever their status, including canceled and unavailable ones.
  - term: period-over-period change
    definition: >-
      A period's value minus (or divided by) the previous period's. For the first period asked
      about, include the period before it in the calculation, then keep only the asked periods.
  - term: per order vs per item
    definition: >-
      Per-order figures come from fct_orders (one row per order); per-item figures from
      fct_order_items. A condition "per order" is tested on the order's totals (gmv, freight, items).
  - term: cohort
    definition: Customers grouped by the date of their first valid order.

views:
  fct_orders:
    grain: one row per order, every status
    description: >-
      Orders with totals, delivery outcome, latest review and the person's order number.
      Category, seller tier and payment type come from the order's highest-value item or payment.
    columns:
      is_valid: FALSE for canceled and unavailable orders; filter on it for sales metrics
      is_canceled: TRUE for canceled or unavailable orders
      is_delivered: TRUE when the order reached the customer and has a delivery date
      is_late: TRUE when delivered after the estimated date (calendar dates); NULL if undelivered
      purchased_at: when the order was placed; the date field for every metric
      delivered_at: when the customer received it; do not use for date filters
      gmv: sum of item prices in the order, excluding freight (R$)
      items: number of item units in the order
      delivery_days: days from purchase to delivery
      customer_order_number: 1 for the person's first valid order, 2 for the second, ...
      repeat_within_90d: on a first order, TRUE if the second order came within 90 days
      has_90d_followup: TRUE if the order is 90+ days before the data cutoff
      next_order_at: when the person placed their next valid order (NULL if none)
      days_to_next_order: days from this order to the person's next valid order
      delivery_status: late / on_time for delivered orders
      customer_type: first_order / repeat_order for valid orders
  fct_order_items:
    grain: one row per order item (one unit of one product)
    description: Item price and freight with the item's own category and seller tier.
    columns:
      is_valid: FALSE for items on canceled and unavailable orders
      price: item price, excluding freight (R$)
      freight_value: freight charged for the item (R$)
  fct_payments:
    grain: one row per payment within an order
    description: Payment type, instalments and value, with the order's dimensions.
    columns:
      is_valid: FALSE for payments on canceled and unavailable orders
      payment_value: amount paid, including freight (R$)
      installments: number of instalments (1 unless paid by credit card)

dimensions:
  customer_state:
    column: customer_state
    description: Two-letter Brazilian state of the customer's address.
    synonyms: [state, region, customer region, UF]
  product_category:
    column: product_category
    description: >-
      English product category. On order-level metrics it is the category of the order's
      highest-value item.
    synonyms: [category, product type, department]
  payment_type:
    column: payment_type
    description: >-
      credit_card, boleto, voucher, debit_card or not_defined. On order-level metrics it is
      the order's highest-value payment.
    synonyms: [payment method, how they paid]
  seller_tier:
    column: seller_tier
    description: >-
      Seller size from GMV in the 3 full months before the order month: top (top 10% of
      sellers), mid (next 40%), long_tail (the rest), new_or_dormant (no GMV in those months).
    synonyms: [seller size, seller segment, seller band]
  delivery_status:
    column: delivery_status
    description: late or on_time, for delivered orders (compared as calendar dates).
    synonyms: [late vs on time, on-time vs late, delivery outcome]
    required_filters: [delivery_status IS NOT NULL]  # delivered orders only; works on every table
  customer_type:
    column: customer_type
    description: >-
      first_order (the person's first valid order) or repeat_order (any later valid order,
      pooled), for valid orders.
    synonyms: [first vs repeat orders, new vs returning, first-time vs repeat]
    required_filters: [customer_type IS NOT NULL]  # valid orders only; works on every table

metrics:
  gmv:
    label: GMV
    description: Gross merchandise value. Sum of item prices, excluding freight, on valid orders.
    view: fct_order_items
    expression: SUM(price)
    grain: order item
    required_filters: [is_valid]
    date_field: purchased_at
    unit: BRL
    synonyms: [gross merchandise value, sales, revenue, gross sales, turnover]

  orders:
    label: Orders
    description: Number of valid orders (not canceled or unavailable).
    view: fct_orders
    expression: COUNT(*)
    grain: order
    required_filters: [is_valid]
    date_field: purchased_at
    unit: orders
    synonyms: [order count, number of orders, purchases, order volume]

  orders_placed:
    label: Orders placed
    description: >-
      Number of orders placed, whatever happened to them afterwards: includes canceled and
      unavailable orders (D24). Use for questions that ask how many orders were "placed".
    view: fct_orders
    expression: COUNT(*)
    grain: order
    required_filters: []
    date_field: purchased_at
    unit: orders
    synonyms: [orders placed, placed orders, all orders, orders including cancellations]

  aov:
    label: Average order value
    description: GMV divided by valid orders that have at least one item. Excludes freight.
    view: fct_orders
    expression: SUM(gmv) / COUNT(*)
    grain: order
    required_filters: [is_valid, items > 0]
    date_field: purchased_at
    unit: BRL
    synonyms: [AOV, average basket, basket size, average order size, average ticket]

  items_per_order:
    label: Items per order
    description: Average number of item units per valid order with at least one item.
    view: fct_orders
    expression: AVG(items)
    grain: order
    required_filters: [is_valid, items > 0]
    date_field: purchased_at
    unit: items
    synonyms: [basket depth, units per order, UPT]

  active_customers:
    label: Active customers
    description: Distinct people (customer_unique_id) with at least one valid order.
    view: fct_orders
    expression: COUNT(DISTINCT customer_unique_id)
    grain: order
    required_filters: [is_valid]
    date_field: purchased_at
    unit: customers
    synonyms: [customers, buyers, unique customers, purchasing customers]

  new_customers:
    label: New customers
    description: >-
      Distinct people whose first valid order in the full history falls in the period. The data
      starts in Sep 2016, so "first" means first in this dataset.
    view: fct_orders
    expression: COUNT(DISTINCT customer_unique_id)
    grain: order
    required_filters: [is_valid, customer_order_number = 1]
    date_field: purchased_at
    unit: customers
    synonyms: [first-time customers, first-time buyers, acquired customers, new buyers]

  repeat_purchase_rate:
    label: 90-day repeat purchase rate
    description: >-
      Of customers whose first valid order falls in the period, the share who placed a second
      valid order within 90 days of the first. Customers whose first order is less than 90 days
      before the data cutoff (3 Sep 2018) are excluded, since their window is incomplete.
    view: fct_orders
    expression: AVG(CASE WHEN repeat_within_90d THEN 1 ELSE 0 END)
    grain: order (first orders only)
    required_filters: [is_valid, customer_order_number = 1, has_90d_followup]
    date_field: purchased_at
    unit: ratio
    synonyms: [repeat rate, 90-day repeat rate, returning customer rate, retention, repurchase rate, loyalty]

  active_sellers:
    label: Active sellers
    description: Distinct sellers with at least one item on a valid order.
    view: fct_order_items
    expression: COUNT(DISTINCT seller_id)
    grain: order item
    required_filters: [is_valid]
    date_field: purchased_at
    unit: sellers
    synonyms: [sellers, merchants, selling sellers, number of sellers]

  gmv_per_seller:
    label: GMV per seller
    description: GMV divided by active sellers.
    view: fct_order_items
    expression: SUM(price) / COUNT(DISTINCT seller_id)
    grain: order item
    required_filters: [is_valid]
    date_field: purchased_at
    unit: BRL
    synonyms: [sales per seller, average seller GMV, seller productivity]

  freight_ratio:
    label: Freight ratio
    description: Total freight divided by total item price on valid orders.
    view: fct_order_items
    expression: SUM(freight_value) / SUM(price)
    grain: order item
    required_filters: [is_valid]
    date_field: purchased_at
    unit: ratio
    synonyms: [shipping cost ratio, freight share, freight to price, shipping as percent of price]

  on_time_delivery_rate:
    label: On-time delivery rate
    description: >-
      Share of delivered orders that arrived on or before the estimated delivery date (compared
      as calendar dates). Right-censored for late Aug 2018: slow orders were still in transit.
    view: fct_orders
    expression: AVG(CASE WHEN is_late THEN 0 ELSE 1 END)
    grain: order
    required_filters: [is_delivered]
    date_field: purchased_at
    unit: ratio
    synonyms: [on-time rate, OTD, delivery reliability, delivered on time]

  avg_delivery_days:
    label: Average delivery days
    description: Average days from purchase to delivery to the customer, for delivered orders.
    view: fct_orders
    expression: AVG(delivery_days)
    grain: order
    required_filters: [is_delivered]
    date_field: purchased_at
    unit: days
    synonyms: [delivery time, time to deliver, shipping time, lead time, days to deliver]

  late_delivery_rate:
    label: Late delivery rate
    description: >-
      Share of delivered orders that arrived after the estimated delivery date (compared as
      calendar dates). Equals 1 minus on-time delivery rate.
    view: fct_orders
    expression: AVG(CASE WHEN is_late THEN 1 ELSE 0 END)
    grain: order
    required_filters: [is_delivered]
    date_field: purchased_at
    unit: ratio
    synonyms: [late rate, late deliveries, delayed orders, delay rate]

  cancellation_rate:
    label: Cancellation rate
    description: >-
      Share of all orders that were canceled or became unavailable after being placed.
    view: fct_orders
    expression: AVG(CASE WHEN is_canceled THEN 1 ELSE 0 END)
    grain: order
    required_filters: []
    date_field: purchased_at
    unit: ratio
    synonyms: [cancel rate, cancelled orders, canceled share, order cancellations]

  avg_review_score:
    label: Average review score
    description: Average 1-5 review score, using the latest review per order.
    view: fct_orders
    expression: AVG(review_score)
    grain: order
    required_filters: [review_score IS NOT NULL]
    date_field: purchased_at
    unit: score (1-5)
    synonyms: [rating, average rating, review score, customer satisfaction, CSAT, stars]

  low_review_share:
    label: Share of 1-2 star reviews
    description: Share of reviewed orders whose latest review scored 1 or 2.
    view: fct_orders
    expression: AVG(CASE WHEN review_score <= 2 THEN 1 ELSE 0 END)
    grain: order
    required_filters: [review_score IS NOT NULL]
    date_field: purchased_at
    unit: ratio
    synonyms: [bad reviews, negative reviews, detractors, low ratings, 1-2 star share]

  avg_installments:
    label: Average instalments
    description: >-
      Average number of instalments on credit card payments of valid orders. Other payment
      types are always 1 instalment, so they are excluded.
    view: fct_payments
    expression: AVG(installments)
    grain: payment
    required_filters: [is_valid, "payment_type = 'credit_card'"]
    date_field: purchased_at
    unit: instalments
    synonyms: [installments, instalments, number of installments, payment plan length]

  credit_card_payment_share:
    label: Credit card payment share
    description: Share of payment value on valid orders paid by credit card.
    view: fct_payments
    expression: >-
      SUM(payment_value) FILTER (WHERE payment_type = 'credit_card') / SUM(payment_value)
    grain: payment
    required_filters: [is_valid]
    date_field: purchased_at
    unit: ratio
    synonyms: [card share, credit card share, share paid by card, credit card usage]

  # Added in D37 after the failure analysis: everyday measures the planner had no metric for.
  total_freight:
    label: Total freight
    description: Total freight charged to customers on valid orders (R$). Not the carriers' cost.
    view: fct_order_items
    expression: SUM(freight_value)
    grain: order item
    required_filters: [is_valid]
    date_field: purchased_at
    unit: BRL
    synonyms: [freight, shipping charged, freight charged, freight paid, shipping fees, delivery fees]

  freight_per_order:
    label: Freight per order
    description: Average freight charged per valid order with at least one item (R$).
    view: fct_orders
    expression: SUM(freight) / COUNT(*)
    grain: order
    required_filters: [is_valid, items > 0]
    date_field: purchased_at
    unit: BRL
    synonyms: [average freight per order, shipping cost per order, freight per order]

  payment_value:
    label: Payment value
    description: >-
      Total amount customers paid on valid orders (R$), including freight and instalment
      interest. Use for "how much was paid", by payment type.
    view: fct_payments
    expression: SUM(payment_value)
    grain: payment
    required_filters: [is_valid]
    date_field: purchased_at
    unit: BRL
    synonyms: [amount paid, money paid, payments, total paid, paid amount]

  canceled_orders:
    label: Canceled orders
    description: Number of orders that were canceled or became unavailable after being placed.
    view: fct_orders
    expression: COUNT(*)
    grain: order
    required_filters: [is_canceled]
    date_field: purchased_at
    unit: orders
    synonyms: [cancellations, canceled orders, cancelled orders, unavailable orders, number canceled]

  median_delivery_days:
    label: Median delivery days
    description: Median days from purchase to delivery, for delivered orders.
    view: fct_orders
    expression: MEDIAN(delivery_days)
    grain: order
    required_filters: [is_delivered]
    date_field: purchased_at
    unit: days
    synonyms: [median delivery time, typical delivery time, median days to deliver]

  # Cohort metrics (D43): read on first orders, dated by the first order.
  days_to_second_order:
    label: Days to second order
    description: >-
      For first-time customers who ordered again, the average days between their first and
      second valid order. Cohort = the first order's date.
    view: fct_orders
    expression: AVG(days_to_next_order)
    grain: order (first orders that have a next order)
    required_filters: [is_valid, customer_order_number = 1, next_order_at IS NOT NULL]
    date_field: purchased_at
    unit: days
    synonyms: [time to second order, days between first and second order, time to repurchase]

  returning_customers:
    label: Returning customers
    description: >-
      First-time customers in the period who placed another valid order before the end of the
      analysis window. Cohort = the first order's date.
    view: fct_orders
    expression: COUNT(*)
    grain: order (first orders)
    required_filters: [is_valid, customer_order_number = 1, "next_order_at < DATE '2018-09-01'"]
    date_field: purchased_at
    unit: customers
    synonyms: [customers who came back, customers who ordered again, repeat customers, came back]
