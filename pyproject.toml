[project]
name = "analytics-copilot"
version = "0.1.0"
description = "AI analytics copilot over the Olist marketplace dataset: governed metrics, text-to-SQL with grounding, and evals."
readme = "README.md"
# 3.10+ so the package also installs on Kaggle's preinstalled Python.
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "openai>=1.40",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlglot>=25",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "kaggle>=1.7",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_copilot"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Paste-into-notebook cells with %pip magics, not importable Python.
extend-exclude = ["kaggle/kaggle_starter.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
